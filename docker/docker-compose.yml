services:
  postgres:
    image: postgres:16-alpine
    container_name: next16-template-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: template_samples
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d template_samples"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
